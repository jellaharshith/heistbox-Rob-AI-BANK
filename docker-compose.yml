services:
  server:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    command: sh -c "pip install --no-cache-dir fastapi uvicorn httpx pydantic python-dotenv pynacl z3-solver && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  web:
    image: node:20-alpine
    working_dir: /app/web/ui
    volumes:
      - ./web/ui:/app/web/ui
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_MODE: ${VITE_API_MODE:-offline}
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - server

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heistbox
      POSTGRES_USER: heistbox
      POSTGRES_PASSWORD: heistbox
    ports:
      - "5432:5432"
    volumes:
      - heistbox_pgdata:/var/lib/postgresql/data

volumes:
  heistbox_pgdata:

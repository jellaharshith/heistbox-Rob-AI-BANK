<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HeistBox 3D Isometric World - Standalone Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0B0F1E;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #viewport {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      cursor: grab;
    }

    #viewport:active {
      cursor: grabbing;
    }

    /* Glassmorphism Cyber-Vegas UI */
    .hud-panel {
      position: absolute;
      background: rgba(11, 15, 30, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 201, 60, 0.25);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    /* Simulation Badge */
    #badge-sim {
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #FFC93C;
      border-color: rgba(255, 201, 60, 0.45);
      background: rgba(11, 15, 30, 0.9);
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10B981;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    /* Top Action Bar (Steps & Controls) */
    #top-bar {
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 90vw;
      overflow-x: auto;
      white-space: nowrap;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #F8FAFC;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn:hover {
      background: rgba(255, 201, 60, 0.2);
      border-color: #FFC93C;
      color: #FFC93C;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.active {
      background: #FFC93C;
      color: #0B0F1E;
      border-color: #FFC93C;
      box-shadow: 0 0 14px rgba(255, 201, 60, 0.4);
    }

    .btn-step {
      padding: 6px 10px;
    }

    /* Wanted Stars */
    .stars-wrap {
      display: flex;
      align-items: center;
      gap: 3px;
      color: #94A3B8;
      cursor: pointer;
      padding: 0 4px;
    }

    .star-icon {
      font-size: 16px;
      transition: color 0.15s, transform 0.15s;
    }

    .star-icon.filled {
      color: #EF4444;
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
      transform: scale(1.1);
    }

    /* Left Drawer: Camera & Areas */
    #left-panel {
      top: 64px;
      left: 14px;
      display: flex;
      flex-col;
      gap: 6px;
      flex-direction: column;
      width: 140px;
    }

    .panel-title {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 2px;
    }

    /* Right Drawer: Environment & Time */
    #right-panel {
      top: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 160px;
    }

    select, input[type="range"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #F8FAFC;
      border-radius: 6px;
      padding: 5px;
      font-size: 11px;
      outline: none;
    }

    select option {
      background: #0B0F1E;
      color: #F8FAFC;
    }

    /* Entity Inspection Card */
    #entity-card {
      bottom: 14px;
      left: 14px;
      max-width: 320px;
      display: none;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    #entity-name {
      font-size: 14px;
      font-weight: 800;
      color: #FFC93C;
      margin-bottom: 2px;
    }

    #entity-type {
      font-size: 10px;
      text-transform: uppercase;
      color: #94A3B8;
      margin-bottom: 6px;
    }

    #entity-desc {
      font-size: 11px;
      line-height: 1.4;
      color: #E2E8F0;
    }

    /* Mini-Map HUD */
    #minimap-card {
      bottom: 14px;
      right: 14px;
      padding: 6px;
      width: 148px;
      height: 148px;
    }

    #minimap-canvas {
      width: 100%;
      height: 100%;
      background: #070A14;
      border-radius: 8px;
      display: block;
    }

    /* Metrics Bar */
    #metrics {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      font-family: monospace;
      display: flex;
      gap: 14px;
      pointer-events: none;
    }

    /* Mobile Responsive Tweaks */
    @media (max-width: 768px) {
      #badge-sim { font-size: 10px; padding: 5px 9px; top: 10px; left: 10px; }
      #left-panel { display: none; }
      #right-panel {
        top: 10px;
        right: 10px;
        padding: 6px 10px;
        gap: 6px;
      }
      #right-panel .panel-title,
      #right-panel #time-slider { display: none; }
      #top-bar {
        top: auto;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100vw - 20px);
        max-width: 100vw;
        padding: 6px 10px;
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
      }
      #top-bar .btn {
        padding: 5px 8px;
        font-size: 11px;
        white-space: nowrap;
      }
      #minimap-card { display: none; }
      #entity-card { max-width: 260px; bottom: 70px; left: 10px; }
      #metrics { display: none; }
    }
  </style>
</head>
<body>
  <!-- Three.js Canvas -->
  <canvas id="viewport"></canvas>

  <!-- Simulation Badge -->
  <div id="badge-sim" class="hud-panel">
    <div class="pulse-dot"></div>
    <span>SIMULATION</span>
  </div>

  <!-- Top Action Bar -->
  <div id="top-bar" class="hud-panel">
    <button class="btn btn-step" id="btn-step-1" title="Step 1: Thief approaches counter">① Bluff</button>
    <button class="btn btn-step" id="btn-step-2" title="Step 2: Teller routes to 3 vaults">② Route</button>
    <button class="btn btn-step" id="btn-step-3" title="Step 3: Left Vault Robbed (LLM Judge)">③ Left Stolen</button>
    <button class="btn btn-step" id="btn-step-4" title="Step 4: Middle Vault Freeze (Kill-Switch)">④ Mid Freeze</button>
    <button class="btn btn-step" id="btn-step-5" title="Step 5: Right Vault PAIR Gate Slam">⑤ Right Slam</button>
    <button class="btn btn-step" id="btn-step-6" title="Step 6: Police Chase Finale">⑥ Chase</button>
    <button class="btn" id="btn-loop" title="Run full autonomous simulation loop">▶ Play Loop</button>
    <button class="btn" id="btn-reset" title="Reset scene to initial state">↺ Reset</button>

    <!-- Wanted Stars -->
    <div class="stars-wrap" id="stars-wrap" title="Wanted Level (Click to set)">
      <span class="star-icon" data-star="1">★</span>
      <span class="star-icon" data-star="2">★</span>
      <span class="star-icon" data-star="3">★</span>
      <span class="star-icon" data-star="4">★</span>
      <span class="star-icon" data-star="5">★</span>
    </div>
  </div>

  <!-- Left Camera Navigation -->
  <div id="left-panel" class="hud-panel">
    <div class="panel-title">Camera Focus</div>
    <button class="btn" data-area="Lobby">🏛️ Lobby</button>
    <button class="btn" data-area="Vault Hall">🔒 Vault Hall</button>
    <button class="btn" data-area="Server Room">💻 Servers</button>
    <button class="btn" data-area="Shredder & Garage">⚙️ Shredder</button>
    <button class="btn" data-area="Casino Tower">🎰 Jackpot Tower</button>
    <button class="btn" id="btn-cinematic" style="margin-top: 4px;">🎬 Cinematic Tour</button>
  </div>

  <!-- Right Environment Controls -->
  <div id="right-panel" class="hud-panel">
    <div class="panel-title">Weather</div>
    <select id="weather-select">
      <option value="Clear Night">Clear Night</option>
      <option value="Rain">Rain</option>
      <option value="Fog">Fog</option>
      <option value="Sandstorm">Sandstorm</option>
    </select>

    <div class="panel-title" style="margin-top: 4px;">Time of Day</div>
    <input type="range" id="time-slider" min="0" max="1" step="0.02" value="0.0">

    <div style="display: flex; gap: 6px; margin-top: 6px;">
      <button class="btn" id="btn-mute" style="flex: 1;" title="Toggle SFX Mute">🔊 Sound</button>
      <button class="btn" id="btn-quality" style="flex: 1;" title="Toggle Low/High Quality">⚡ High</button>
    </div>
  </div>

  <!-- Clicked Entity Inspection Card -->
  <div id="entity-card" class="hud-panel">
    <div id="entity-name">Main Bank Lobby</div>
    <div id="entity-type">Building</div>
    <div id="entity-desc">Grand two-story Las Vegas bank entrance with neoclassical columns.</div>
  </div>

  <!-- Mini-Map -->
  <div id="minimap-card" class="hud-panel">
    <canvas id="minimap-canvas" width="136" height="136"></canvas>
  </div>

  <!-- Performance Metrics -->
  <div id="metrics">
    <span id="fps-counter">60 FPS</span>
    <span id="calls-counter">Calls: --</span>
    <span id="poly-counter">Tris: --</span>
  </div>

  <!-- Module Script -->
  <script type="module">
    import { mountScene } from './index.js';

    const canvas = document.getElementById('viewport');
    const scene = mountScene(canvas);

    // Expose scene to window for automated testing / screenshots
    window.__HEISTBOX_SCENE__ = scene;
    window.scene = scene;

    // UI Elements
    const stepBtns = [1, 2, 3, 4, 5, 6].map(s => document.getElementById(`btn-step-${s}`));
    const btnLoop = document.getElementById('btn-loop');
    const btnReset = document.getElementById('btn-reset');
    const btnCinematic = document.getElementById('btn-cinematic');
    const btnMute = document.getElementById('btn-mute');
    const btnQuality = document.getElementById('btn-quality');
    const weatherSelect = document.getElementById('weather-select');
    const timeSlider = document.getElementById('time-slider');
    const starIcons = Array.from(document.querySelectorAll('.star-icon'));

    const entityCard = document.getElementById('entity-card');
    const entityName = document.getElementById('entity-name');
    const entityType = document.getElementById('entity-type');
    const entityDesc = document.getElementById('entity-desc');

    const fpsCounter = document.getElementById('fps-counter');
    const callsCounter = document.getElementById('calls-counter');
    const polyCounter = document.getElementById('poly-counter');

    // Mini-map setup
    const minimapCanvas = document.getElementById('minimap-canvas');
    const miniCtx = minimapCanvas.getContext('2d');

    // 1. Step Buttons
    stepBtns.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        scene.setStep(idx + 1);
        updateActiveStep(idx + 1);
      });
    });

    function updateActiveStep(currentStep) {
      stepBtns.forEach((btn, idx) => {
        btn.classList.toggle('active', (idx + 1) === currentStep);
      });
    }

    // 2. Play Loop / Reset
    btnLoop.addEventListener('click', () => {
      if (scene.simulation.isPlaying) {
        scene.stopLoop();
        btnLoop.textContent = '▶ Play Loop';
        btnLoop.classList.remove('active');
      } else {
        scene.playLoop();
        btnLoop.textContent = '⏸ Pause';
        btnLoop.classList.add('active');
      }
    });

    btnReset.addEventListener('click', () => {
      scene.reset();
      updateActiveStep(0);
      updateStars(0);
      btnLoop.textContent = '▶ Play Loop';
      btnLoop.classList.remove('active');
    });

    // 3. Wanted Stars
    function updateStars(num) {
      starIcons.forEach((icon, idx) => {
        icon.classList.toggle('filled', idx < num);
      });
    }

    starIcons.forEach(icon => {
      icon.addEventListener('click', (e) => {
        const num = parseInt(e.target.dataset.star, 10);
        scene.setWantedStars(num);
        updateStars(num);
      });
    });

    scene.simulation.onStateChange = ({ step, stars }) => {
      updateActiveStep(step);
      updateStars(stars);
      if (scene.effects && weatherSelect.value !== scene.effects.currentWeather) {
        weatherSelect.value = scene.effects.currentWeather;
      }
    };

    // 4. Camera Focus Areas
    document.querySelectorAll('[data-area]').forEach(btn => {
      btn.addEventListener('click', () => {
        const area = btn.dataset.area;
        scene.flyToArea(area);
      });
    });

    // 5. Cinematic Mode
    let isCinematic = false;
    btnCinematic.addEventListener('click', () => {
      isCinematic = !isCinematic;
      scene.setCinematic(isCinematic);
      btnCinematic.classList.toggle('active', isCinematic);
    });

    // Cancel cinematic state when user interacts
    window.addEventListener('pointerdown', () => {
      if (isCinematic) {
        isCinematic = false;
        btnCinematic.classList.remove('active');
      }
    });

    // 6. Weather & Time
    weatherSelect.addEventListener('change', (e) => {
      scene.setWeather(e.target.value);
    });

    timeSlider.addEventListener('input', (e) => {
      scene.setTimeOfDay(parseFloat(e.target.value));
    });

    // 7. Mute & Quality
    let isMuted = false;
    btnMute.addEventListener('click', () => {
      isMuted = scene.toggleMute();
      btnMute.textContent = isMuted ? '🔇 Muted' : '🔊 Sound';
      btnMute.classList.toggle('active', isMuted);
    });

    let isLowQuality = false;
    btnQuality.addEventListener('click', () => {
      isLowQuality = !isLowQuality;
      scene.setQuality(isLowQuality);
      btnQuality.textContent = isLowQuality ? '⚡ Low' : '⚡ High';
      btnQuality.classList.toggle('active', isLowQuality);
    });

    // 8. Entity Selection Callback
    scene.onSelect((entity) => {
      if (!entity) {
        entityCard.style.display = 'none';
        return;
      }
      entityName.textContent = entity.name || 'Unknown Entity';
      entityType.textContent = (entity.type || 'Object').toUpperCase();
      entityDesc.textContent = entity.details || 'Interactive campus asset.';
      entityCard.style.display = 'block';
    });

    // 9. Mini-Map & Metrics Update Loop
    let lastTime = performance.now();
    let frameCount = 0;

    function renderHUD() {
      requestAnimationFrame(renderHUD);

      // FPS & Draw Calls
      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        fpsCounter.textContent = `${frameCount} FPS`;
        frameCount = 0;
        lastTime = now;

        if (scene.renderer && scene.renderer.info) {
          callsCounter.textContent = `Calls: ${scene.renderer.info.render.calls}`;
          polyCounter.textContent = `Tris: ${(scene.renderer.info.render.triangles / 1000).toFixed(1)}k`;
        }
      }

      // 2D Radar Mini-map
      miniCtx.fillStyle = '#070A14';
      miniCtx.fillRect(0, 0, 136, 136);

      // Draw campus perimeter box
      miniCtx.strokeStyle = 'rgba(255, 201, 60, 0.35)';
      miniCtx.lineWidth = 1.5;
      miniCtx.strokeRect(10, 10, 116, 116);

      // Draw bank building footprint
      miniCtx.fillStyle = 'rgba(30, 41, 59, 0.7)';
      miniCtx.fillRect(44, 40, 48, 36);

      // Map scale factor: world (-60 to 60) -> minimap (10 to 126)
      const toMap = (wx, wz) => {
        const mx = 68 + (wx / 60) * 52;
        const my = 68 + (wz / 60) * 52;
        return [mx, my];
      };

      // Draw entities as colored radar dots
      if (scene.simulation && scene.simulation.chars) {
        const chars = scene.simulation.chars.characters;
        chars.forEach(c => {
          const [cx, cy] = toMap(c.position.x, c.position.z);
          miniCtx.fillStyle = c.role === 'thief' ? '#EF4444' : c.role === 'guard' ? '#3B82F6' : '#10B981';
          miniCtx.beginPath();
          miniCtx.arc(cx, cy, 3, 0, Math.PI * 2);
          miniCtx.fill();
        });
      }

      // Draw helicopter
      if (scene.simulation && scene.simulation.vehicles && scene.simulation.vehicles.helicopter) {
        const hPos = scene.simulation.vehicles.helicopter.mesh.position;
        const [hx, hy] = toMap(hPos.x, hPos.z);
        miniCtx.fillStyle = '#FACC15';
        miniCtx.fillRect(hx - 2.5, hy - 2.5, 5, 5);
      }
    }
    renderHUD();
  </script>
</body>
</html>

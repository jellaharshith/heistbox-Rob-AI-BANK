<!doctype html>
<html><head><meta charset="utf-8"><title>HeistBox asset viewer</title>
<style>
 html,body{margin:0;height:100%;background:#15171c;color:#dde;font:12px system-ui,sans-serif;overflow:hidden}
 #c{position:absolute;inset:0;width:100%;height:100%;display:block}
 #ui{position:absolute;left:8px;top:8px;max-width:260px;max-height:calc(100% - 16px);overflow:auto;background:#0009;padding:8px;border-radius:6px}
 #ui h4{margin:8px 0 4px;font-size:11px;color:#8ab}
 button{margin:1px;padding:2px 6px;background:#2a3040;color:#dde;border:1px solid #456;border-radius:3px;cursor:pointer;font-size:11px}
 button.on{background:#27a;border-color:#6bf}
 label{display:flex;align-items:center;gap:4px;font-size:10px} input[type=range]{flex:1;min-width:60px}
 #sel{width:100%}
</style></head>
<body><canvas id="c"></canvas><div id="ui"></div>
<script type="module" src="./main.js"></script></body></html>
